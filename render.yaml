services:
  - type: web
    name: drip-private-beta
    runtime: static
    buildCommand: echo "Drip static site ready"
    staticPublishPath: .
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
